<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1im HTML 플레이어</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#111;color:#eee;
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif}
  #view{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#111}
  #setup{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:4%}
  .box{width:100%;max-width:620px;background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:26px}
  h1{font-size:20px;margin-bottom:4px}
  .sub{font-size:13px;color:#999;margin-bottom:18px}
  #drop{border:2px dashed #555;border-radius:12px;padding:30px 16px;text-align:center;cursor:pointer;transition:.2s;font-size:15px}
  #drop:hover,#drop.over{border-color:#F37021;background:rgba(243,112,33,.08)}
  #drop b{color:#F37021}
  .or{text-align:center;color:#666;font-size:12px;margin:14px 0}
  .row{display:flex;gap:8px}
  input[type=text]{flex:1;background:#111;border:1px solid #444;border-radius:8px;color:#fff;padding:10px 12px;font-size:14px}
  button{background:#F37021;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
  button.ghost{background:#333}
  #status{margin-top:14px;font-size:13px;color:#aaa;min-height:18px}
  #status.err{color:#ff6b6b}
  .foot{margin-top:16px;display:flex;justify-content:space-between;align-items:center}
  #gear{position:absolute;right:8px;top:8px;z-index:10;width:30px;height:30px;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;border:1px solid #555;font-size:15px;cursor:pointer;display:none;padding:0}
  #gear:hover{border-color:#F37021}
</style>
</head>
<body>
<iframe id="view" allow="fullscreen; clipboard-read; clipboard-write; autoplay"></iframe>
<button id="gear" title="HTML 바꾸기">⚙</button>

<div id="setup">
  <div class="box">
    <h1>1im HTML 플레이어</h1>
    <p class="sub">이 슬라이드에 띄울 HTML을 넣어 주세요. 파일로 넣으면 내용이 이 PPT 파일 안에 저장됩니다.</p>
    <div id="drop">📄 HTML 파일을 <b>여기에 끌어놓거나 클릭</b>해서 고르세요
      <input id="file" type="file" accept=".html,.htm,text/html" hidden>
    </div>
    <div class="or">또는 https 주소로 불러오기</div>
    <div class="row">
      <input id="url" type="text" placeholder="https://...">
      <button id="useUrl">불러오기</button>
    </div>
    <div id="status"></div>
    <div class="foot">
      <button class="ghost" id="cancel" style="display:none">닫기</button>
      <span style="font-size:11px;color:#666">슬라이드쇼에서는 ⚙ 버튼이 숨겨집니다</span>
    </div>
  </div>
</div>

<script>
(function(){
  var CHUNK = 30000;               // 설정값 하나당 글자 수
  var view = document.getElementById('view');
  var setup = document.getElementById('setup');
  var gear = document.getElementById('gear');
  var statusEl = document.getElementById('status');
  var cancelBtn = document.getElementById('cancel');
  var inOffice = false, hasContent = false, isReadView = false;

  function msg(t, err){ statusEl.textContent = t || ''; statusEl.className = err ? 'err' : ''; }
  function showSetup(on){
    setup.style.display = on ? 'flex' : 'none';
    cancelBtn.style.display = (on && hasContent) ? 'inline-block' : 'none';
    updateGear();
  }
  function updateGear(){
    gear.style.display = (hasContent && !isReadView && setup.style.display !== 'flex') ? 'block' : 'none';
  }
  function showHtml(html){
    view.removeAttribute('src'); view.srcdoc = html; view.style.display = 'block';
    hasContent = true; showSetup(false);
  }
  function showUrl(u){
    view.removeAttribute('srcdoc'); view.src = u; view.style.display = 'block';
    hasContent = true; showSetup(false);
  }

  /* ---------- gzip + base64 (지원 안 되면 원문 저장) ---------- */
  function toB64(buf){
    var bytes = new Uint8Array(buf), s = '';
    for (var i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function fromB64(b64){
    var s = atob(b64), bytes = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
    return bytes;
  }
  function pack(text){
    if (!window.CompressionStream) return Promise.resolve({gz:false, data:text});
    var stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
    return new Response(stream).arrayBuffer().then(function(b){ return {gz:true, data:toB64(b)}; })
      .catch(function(){ return {gz:false, data:text}; });
  }
  function unpack(gz, data){
    if (!gz) return Promise.resolve(data);
    var stream = new Blob([fromB64(data)]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }

  /* ---------- 문서(PPTX)에 저장 ---------- */
  function S(){ return Office.context.document.settings; }
  function clearChunks(){
    var n = S().get('n') || 0;
    for (var i = 0; i < n; i++) S().remove('c' + i);
    ['n','gz','mode','url','name'].forEach(function(k){ S().remove(k); });
  }
  function saveAll(cb){
    S().saveAsync(function(r){
      if (r.status === Office.AsyncResultStatus.Succeeded) cb(null);
      else cb(r.error ? r.error.message : '저장 실패');
    });
  }
  function saveHtml(text, name){
    if (!inOffice){ showHtml(text); return; }
    msg('저장 중…');
    pack(text).then(function(p){
      clearChunks();
      var n = Math.ceil(p.data.length / CHUNK);
      for (var i = 0; i < n; i++) S().set('c' + i, p.data.substr(i * CHUNK, CHUNK));
      S().set('n', n); S().set('gz', p.gz); S().set('mode', 'html'); S().set('name', name || '');
      saveAll(function(err){
        if (err){ msg('PPT에 저장하지 못했습니다: ' + err + ' — 파일이 너무 크면 https 주소 방식을 써 주세요.', true); return; }
        msg(''); showHtml(text);
      });
    });
  }
  function saveUrl(u){
    if (!/^https:\/\//i.test(u)){ msg('https:// 로 시작하는 주소만 됩니다.', true); return; }
    if (!inOffice){ showUrl(u); return; }
    clearChunks(); S().set('mode', 'url'); S().set('url', u);
    saveAll(function(err){ if (err){ msg('저장 실패: ' + err, true); return; } msg(''); showUrl(u); });
  }
  function loadSaved(){
    var mode = S().get('mode');
    if (mode === 'url' && S().get('url')){ showUrl(S().get('url')); return; }
    if (mode === 'html'){
      var n = S().get('n') || 0, parts = [];
      for (var i = 0; i < n; i++) parts.push(S().get('c' + i) || '');
      unpack(S().get('gz'), parts.join('')).then(showHtml)
        .catch(function(){ showSetup(true); msg('저장된 HTML을 읽지 못했습니다. 다시 넣어 주세요.', true); });
      return;
    }
    showSetup(true);
  }

  /* ---------- 입력 ---------- */
  function readFile(f){
    if (!f) return;
    var r = new FileReader();
    r.onload = function(){ saveHtml(r.result, f.name); };
    r.onerror = function(){ msg('파일을 읽지 못했습니다.', true); };
    r.readAsText(f, 'utf-8');
  }
  var drop = document.getElementById('drop'), file = document.getElementById('file');
  drop.onclick = function(){ file.click(); };
  file.onchange = function(){ readFile(file.files[0]); file.value = ''; };
  drop.ondragover = function(e){ e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = function(){ drop.classList.remove('over'); };
  drop.ondrop = function(e){ e.preventDefault(); drop.classList.remove('over'); readFile(e.dataTransfer.files[0]); };
  document.getElementById('useUrl').onclick = function(){ saveUrl(document.getElementById('url').value.trim()); };
  gear.onclick = function(){ showSetup(true); };
  cancelBtn.onclick = function(){ showSetup(false); };

  /* ---------- 시작 ---------- */
  function start(){
    if (window.Office && Office.onReady){
      Office.onReady(function(info){
        inOffice = !!info.host;
        if (!inOffice){ showSetup(true); msg('브라우저 미리보기 모드입니다 (PPT에 저장되지 않음).'); return; }
        try{
          Office.context.document.getActiveViewAsync(function(r){ isReadView = (r.value === 'read'); updateGear(); });
          Office.context.document.addHandlerAsync(Office.EventType.ActiveViewChanged, function(e){ isReadView = (e.activeView === 'read'); updateGear(); });
        }catch(e){}
        loadSaved();
      });
    } else { showSetup(true); msg('브라우저 미리보기 모드입니다 (PPT에 저장되지 않음).'); }
  }
  start();
})();
</script>
</body>
</html>
